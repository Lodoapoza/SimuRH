name: Build Flutter APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Déclencheur'
        required: false
        default: 'manual'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.22.0'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Generate platform scaffolding
        run: |
          set +e
          flutter create --project-name simurh --org com.simurh _gen 2>&1
          echo "--- FLUTTER CREATE EXIT: $?"
          if [ -d "_gen/android" ]; then
            rm -rf app/android
            mkdir -p app
            cp -r _gen/android app/
            echo "--- ANDROID COPIED"
          else
            echo "--- NO ANDROID DIR"
          fi
          rm -rf _gen
          echo "--- DONE"

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Set build version
        working-directory: app
        run: |
          sed -i "s/^version: .*/version: 1.0.${{ github.run_number }}+${{ github.run_number }}/" pubspec.yaml

      - name: Build APK
        working-directory: app
        run: |
          set -o pipefail
          flutter build apk --release --no-shrink 2>&1 | tee /tmp/build_output.txt
          EC=$?
          echo "::notice::BUILD EXIT CODE: $EC"
          grep -iE '(error|failed|failure|exception|GradleException|BUILD FAILED)' /tmp/build_output.txt 2>/dev/null | head -20 | while read line; do echo "::error::$line"; done
          echo "--- BUILD OUTPUT (last 60 lines) ---"
          tail -60 /tmp/build_output.txt
          echo "--- END BUILD OUTPUT ---"
          exit $EC

      - name: Prepare release
        run: |
          echo "--- APK SEARCH ---"
          find app/build -name "*.apk" 2>/dev/null
          mkdir -p release
          APK=$(find app/build -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" release/SimuRH.apk
            ls -la release/
          else
            echo "--- NO APK ---"
            ls -laR app/build/app/ 2>/dev/null | head -30
            exit 1
          fi

      - name: Upload to Nightly Release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete nightly -y 2>/dev/null || true
          gh release create nightly \
            --title "SimuRH Nightly Build" \
            --notes "Build #${{ github.run_number }} — $(date -u +'%Y-%m-%d %H:%M UTC') — Commit: ${{ github.sha }}" \
            release/SimuRH.apk
        env:
          GH_TOKEN: ${{ github.token }}
