name: Build Flutter APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Déclencheur'
        required: false
        default: 'manual'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.22.0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Generate platform scaffolding
        run: |
          set +e
          flutter create --project-name simurh --org com.simurh _gen 2>&1
          echo "--- FLUTTER CREATE EXIT: $?"
          if [ -d "_gen/android" ]; then
            cp -r _gen/android/* app/android/
            echo "--- ANDROID COPIED"
          else
            echo "--- NO ANDROID DIR"
          fi
          if [ -d "_gen/ios" ]; then
            cp -r _gen/ios/* app/ios/
            echo "--- IOS COPIED"
          fi
          rm -rf _gen
          echo "--- DONE"
      - name: Install dependencies
        run: flutter pub get
        working-directory: app
      - name: Analyze
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/analyze_output.txt
          EC=$?
          echo "--- EXIT CODE: $EC ---"
          echo "--- FULL OUTPUT ---"
          cat /tmp/analyze_output.txt
          echo "--- END ---"
          exit $EC
        working-directory: app

  build:
    name: Build APK
    needs: analyze
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Generate platform scaffolding
        run: |
          set +e
          flutter create --project-name simurh --org com.simurh _gen 2>&1
          echo "--- FLUTTER CREATE EXIT: $?"
          if [ -d "_gen/android" ]; then
            cp -r _gen/android/* app/android/
            echo "--- ANDROID COPIED"
          else
            echo "--- NO ANDROID DIR"
          fi
          rm -rf _gen
          echo "--- DONE"
      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Set build version
        working-directory: app
        run: |
          sed -i "s/^version: .*/version: 1.0.${{ github.run_number }}+${{ github.run_number }}/" pubspec.yaml

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Prepare release
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/SimuRH.apk

      - name: Upload to Nightly Release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete nightly -y 2>/dev/null || true
          gh release create nightly \
            --title "SimuRH Nightly Build" \
            --notes "Build #${{ github.run_number }} — $(date -u +'%Y-%m-%d %H:%M UTC') — Commit: ${{ github.sha }}" \
            release/SimuRH.apk
        env:
          GH_TOKEN: ${{ github.token }}
