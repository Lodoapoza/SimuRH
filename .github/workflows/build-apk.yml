name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 🏗️ Generate proper Flutter project structure
        run: |
          # Create a template Flutter project to get android/ and other required dirs
          flutter create --project-name simurh --org com.simurh _template
          # Copy our custom code over the template
          cp -r app/lib _template/lib
          cp app/pubspec.yaml _template/pubspec.yaml
          rm -rf app
          mv _template app

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🔨 Build APK
        working-directory: app
        run: flutter build apk --debug

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simurh-apk-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
