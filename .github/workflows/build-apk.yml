name: Build Flutter APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 🏗️ Generate proper Flutter project structure
        run: |
          flutter create --project-name simurh --org com.simurh _template
          rm -rf _template/lib
          mv app/lib _template/lib
          cp app/pubspec.yaml _template/pubspec.yaml
          rm -rf app
          mv _template app

      - name: 📝 Set build version
        working-directory: app
        run: sed -i "s/^version: .*/version: 1.0.${{ github.run_number }}+${{ github.run_number }}/" pubspec.yaml

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🔨 Build APK (arm64 only)
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: 🏷️ Rename APK
        run: |
          mkdir -p release
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/SimuRH.apk

      - name: 🚀 Upload to Nightly Release
        run: |
          gh release delete nightly -y 2>/dev/null || true
          gh release create nightly \
            --title "SimuRH Nightly Build" \
            --notes "Build #${{ github.run_number }} — $(date -u +'%Y-%m-%d %H:%M UTC') — Commit: ${{ github.sha }}" \
            release/SimuRH.apk
        env:
          GH_TOKEN: ${{ github.token }}
