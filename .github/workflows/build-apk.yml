name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 🏗️ Generate proper Flutter project structure
        run: |
          flutter create --project-name simurh --org com.simurh _template
          cp -r app/lib _template/lib
          cp app/pubspec.yaml _template/pubspec.yaml
          rm -rf app
          mv _template app

      - name: 📦 Install dependencies
        working-directory: app
        run: flutter pub get

      - name: 🔨 Build APK (arm64 only)
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64 --split-per-abi

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simurh-apk-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk

      - name: 🗑️ Clean up old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-apk.yml',
              status: 'completed',
            });
            console.log(`Found ${runs.workflow_runs.length} completed runs`);
            for (const run of runs.workflow_runs.slice(0, -1)) {
              const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              for (const artifact of artifacts.artifacts) {
                console.log(`Deleting ${artifact.name} from run ${run.id}`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
