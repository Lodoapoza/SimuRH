name: Build Flutter APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Déclencheur'
        required: false
        default: 'manual'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.22.0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: |
          set +e
          dart analyze lib/ 2>&1
          EC=$?
          echo "EXIT_CODE=$EC"
          exit $EC

  build:
    name: Build APK
    needs: analyze
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Generate Android scaffolding
        run: |
          rm -rf ../_scaffold
          flutter create --project-name simurh --org com.simurh ../_scaffold
          cp -r ../_scaffold/android/* android/
          rm -rf ../_scaffold

      - name: Install dependencies
        run: flutter pub get

      - name: Set build version
        run: |
          sed -i "s/^version: .*/version: 1.0.${{ github.run_number }}+${{ github.run_number }}/" pubspec.yaml

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Prepare release
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/SimuRH.apk

      - name: Upload to Nightly Release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete nightly -y 2>/dev/null || true
          gh release create nightly \
            --title "SimuRH Nightly Build" \
            --notes "Build #${{ github.run_number }} — $(date -u +'%Y-%m-%d %H:%M UTC') — Commit: ${{ github.sha }}" \
            release/SimuRH.apk
        env:
          GH_TOKEN: ${{ github.token }}
