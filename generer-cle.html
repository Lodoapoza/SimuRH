<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimuRH — Génération de clés</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
.container { background: white; border-radius: 16px; padding: 32px; max-width: 480px; width: 100%; box-shadow: 0 2px 12px rgba(0,0,0,0.1); align-self: center; }
h1 { font-size: 24px; color: #1a1a2e; margin-bottom: 8px; }
.subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
.field { margin-bottom: 16px; }
label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 4px; }
input, select { width: 100%; padding: 10px 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 15px; transition: border-color 0.2s; }
input:focus, select:focus { outline: none; border-color: #1a1a2e; }
.key-display { background: #f8f9fa; border: 2px dashed #ccc; border-radius: 8px; padding: 16px; text-align: center; font-family: 'Courier New', monospace; font-size: 22px; letter-spacing: 3px; color: #1a1a2e; margin: 20px 0; min-height: 60px; display: flex; align-items: center; justify-content: center; word-break: break-all; }
.key-display.active { border-color: #2ecc71; background: #f0fff4; }
.actions { display: flex; gap: 8px; }
.actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
.actions button:hover { opacity: 0.9; }
.btn-gen { background: #1a1a2e; color: white; }
.btn-copy { background: #2ecc71; color: white; }
.btn-save { background: #3498db; color: white; }
.btn-clear { background: #e74c3c; color: white; }
.history { margin-top: 24px; border-top: 1px solid #eee; padding-top: 16px; }
.history h3 { font-size: 14px; color: #666; margin-bottom: 8px; }
.history-item { background: #f8f9fa; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.history-item .key { font-family: monospace; font-weight: 600; color: #1a1a2e; }
.history-item .meta { color: #888; font-size: 12px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: white; padding: 12px 24px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <h1>🔑 SimuRH</h1>
  <p class="subtitle">Génération de clés d'activation — établissements</p>

  <div class="field">
    <label for="etablissement">Nom de l'établissement</label>
    <input type="text" id="etablissement" placeholder="Ex: Lycée Moderne Bamako" autocomplete="off">
  </div>

  <div class="field">
    <label for="date">Date de la demande</label>
    <input type="date" id="date">
  </div>

  <div class="field">
    <label for="expiry">Année d'expiration</label>
    <select id="expiry"></select>
  </div>

  <div class="key-display" id="keyDisplay">—</div>

  <div class="actions">
    <button class="btn-gen" onclick="generer()">Générer</button>
    <button class="btn-copy" onclick="copier()">Copier</button>
    <button class="btn-save" onclick="sauvegarder()">Export</button>
    <button class="btn-clear" onclick="vider()">Vider</button>
  </div>

  <div class="history" id="historySection">
    <h3>📋 Historique</h3>
    <div id="historyList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SECRET = 'SIMURH_LICENSE_2026_V1';

function formatDate(d) {
  const [y, m, day] = d.split('-');
  return `${day}/${m}/${y}`;
}

function hex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
}

async function hmacSha256(message, secret) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(message));
  return new Uint8Array(sig);
}

function formaterCle(prefix, yearSuffix) {
  // KKKK-KKKK-YYYY
  return prefix.substring(0, 4) + '-' + prefix.substring(4, 8) + '-' + yearSuffix;
}

async function generer() {
  const etab = document.getElementById('etablissement').value.trim();
  const date = document.getElementById('date').value;
  const expiryYear = parseInt(document.getElementById('expiry').value);

  if (!etab) { toast('Veuillez entrer le nom de l\'établissement'); return; }
  if (!date) { toast('Veuillez sélectionner la date'); return; }

  // HMAC sur le nom de l'établissement uniquement
  const hash = await hmacSha256(etab.toLowerCase(), SECRET);
  const prefix = hex(hash).substring(0, 8);
  const yearSuffix = expiryYear.toString(16).toUpperCase().padStart(4, '0');

  const cle = formaterCle(prefix, yearSuffix);

  document.getElementById('keyDisplay').textContent = cle;
  document.getElementById('keyDisplay').className = 'key-display active';

  ajouterHistorique(etab, date, expiryYear, cle);
  toast('Clé générée ✓');
}

function copier() {
  const el = document.getElementById('keyDisplay');
  if (!el.textContent || el.textContent === '—') { toast('Générez d\'abord une clé'); return; }
  navigator.clipboard.writeText(el.textContent).then(() => toast('Copiée ✓'));
}

function sauvegarder() {
  const el = document.getElementById('keyDisplay');
  if (!el.textContent || el.textContent === '—') { toast('Générez d\'abord une clé'); return; }
  const etab = document.getElementById('etablissement').value.trim() || 'inconnu';
  const date = document.getElementById('date').value || '—';
  const expiryYear = document.getElementById('expiry').value;
  const content = `SimuRH — Clé d'activation
Établissement : ${etab}
Date demande : ${formatDate(date)}
Expire fin : ${expiryYear}
Clé : ${el.textContent}
---`;
  const blob = new Blob([content], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `simurh-${etab.replace(/\s+/g, '-').toLowerCase()}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Exporté ✓');
}

function vider() {
  document.getElementById('etablissement').value = '';
  document.getElementById('date').value = '';
  document.getElementById('keyDisplay').textContent = '—';
  document.getElementById('keyDisplay').className = 'key-display';
}

function ajouterHistorique(etab, date, expiryYear, cle) {
  const list = document.getElementById('historyList');
  const item = document.createElement('div');
  item.className = 'history-item';
  item.innerHTML = `<div><div class="key">${cle}</div><div class="meta">${etab} · ${formatDate(date)} · expire fin ${expiryYear}</div></div>
    <button style="background:none;border:1px solid #ddd;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;" onclick="navigator.clipboard.writeText('${cle}').then(()=>toast('Copiée ✓'))">Copier</button>`;
  list.prepend(item);

  const saved = JSON.parse(localStorage.getItem('simurh-cles') || '[]');
  saved.unshift({ etab, date, expiryYear, cle, ts: new Date().toISOString() });
  localStorage.setItem('simurh-cles', JSON.stringify(saved.slice(0, 50)));
}

function chargerHistorique() {
  const saved = JSON.parse(localStorage.getItem('simurh-cles') || '[]');
  saved.forEach(s => ajouterHistorique(s.etab, s.date, s.expiryYear, s.cle));
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  setTimeout(() => t.className = 'toast', 2000);
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('date').value = new Date().toISOString().split('T')[0];
  const sel = document.getElementById('expiry');
  const year = new Date().getFullYear();
  for (let y = year; y <= year + 5; y++) {
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y;
    if (y === year + 1) opt.selected = true;
    sel.appendChild(opt);
  }
  chargerHistorique();
});
</script>
</body>
</html>
