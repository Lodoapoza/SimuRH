name: simurh
description: Application de simulation de gestion RH pour les établissements d'enseignement
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.2.8
  path_provider: ^2.0.15
  http: ^1.1.0
  shared_preferences: ^2.2.0
  flutter_launcher_icons: ^0.13.1
  intl: ^0.18.0
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  # Pour le travail offline et la synchronisation
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Pour le PDF et l'impression
  printing: ^5.11.0
  pdf: ^3.10.1
  file_picker: ^6.1.1
  url_launcher: ^6.2.0
  package_info_plus: ^8.0.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/